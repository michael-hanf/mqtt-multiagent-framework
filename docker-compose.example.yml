version: "3.8"

services:
  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      # ⚠️ Plain-text MQTT — credentials and payloads are unencrypted on the wire.
      # Acceptable on a trusted local network. For network/internet use: enable 8883 TLS below.
      - "1883:1883"             # MQTT plain-text
      # - "8883:8883"           # MQTT over TLS — uncomment together with TLS volumes below
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/passwd:/mosquitto/passwd:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
      # TLS: uncomment when enabling port 8883. Generate certs first (see docs/security.md).
      # - ./mosquitto/certs:/mosquitto/certs:ro
      # ACL: uncomment after copying acl.example to acl and enabling acl_file in mosquitto.conf
      # - ./mosquitto/config/acl:/mosquitto/config/acl:ro

volumes:
  mosquitto_data:
  mosquitto_log:

# ─────────────────────────────────────────────
# SETUP (required before first start):
#
# 1. Create password file (written directly into ./mosquitto/):
#    docker run --rm -v $(pwd)/mosquitto:/mosquitto/config eclipse-mosquitto:2 \
#      mosquitto_passwd -c /mosquitto/config/passwd <your-username>
#    # Enter a password when prompted — file appears at ./mosquitto/passwd
#
# 2. Edit mosquitto/config/mosquitto.conf if needed:
#    - allow_anonymous false  (already set)
#    - password_file /mosquitto/passwd  (already set)
#
# 3. Update your agent-config.json:
#    "auth": { "username": "<your-username>", "password": "<your-password>" }
#
# ⚠️  WARNING: Do NOT commit passwd or agent configs with real credentials.
#     Add passwd and *.local.json to your .gitignore.
# ─────────────────────────────────────────────
