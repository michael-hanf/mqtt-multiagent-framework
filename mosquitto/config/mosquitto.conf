# Mosquitto configuration for MQTT Multi-Agent Framework

listener 1883
allow_anonymous false
password_file /mosquitto/passwd

# Topic ACLs — restrict which agents can publish/subscribe to which topics.
# Copy mosquitto/config/acl.example to mosquitto/config/acl and adapt to your agents.
# Uncomment the line below to activate:
# acl_file /mosquitto/config/acl

# Persistence
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest file /mosquitto/log/mosquitto.log
log_type warning
log_type error

# TLS on port 8883 — recommended for multi-machine / network deployments.
# See docs/security.md for certificate generation instructions.
# Place certs in mosquitto/certs/ before enabling.
listener 8883
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
tls_version tlsv1.2
allow_anonymous false
password_file /mosquitto/passwd
