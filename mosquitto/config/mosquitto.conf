# Mosquitto configuration for MQTT Multi-Agent Framework

listener 1883
# Quick start: anonymous access enabled for local testing.
# For production use, disable anonymous access and set up a password file.
# See docs/infrastructure.md for auth setup.
allow_anonymous true
# password_file /mosquitto/passwd

# Topic ACLs — restrict which agents can publish/subscribe to which topics.
# Copy mosquitto/config/acl.example to mosquitto/config/acl, adapt to your agents,
# then uncomment acl_file AND the ACL volume mount in docker-compose.example.yml.
# acl_file /mosquitto/config/acl

# Persistence
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest file /mosquitto/log/mosquitto.log
log_type warning
log_type error

# TLS on port 8883 — recommended for multi-machine / network deployments.
# To enable:
#   1. Generate certs (see docs/security.md)
#   2. Uncomment the listener block below
#   3. Uncomment the certs volume mount in docker-compose.example.yml
#   4. Uncomment port 8883 in docker-compose.example.yml
#
# listener 8883
# cafile /mosquitto/certs/ca.crt
# certfile /mosquitto/certs/server.crt
# keyfile /mosquitto/certs/server.key
# tls_version tlsv1.2
# allow_anonymous false
# password_file /mosquitto/passwd
